%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Baseline Aerospike investigation (RANS)                    %
% Geometry: sharp spiked hemisphere-cylinder, 2D axisymmetric                  %
% Author: Forlini, Garagnani, Garofalo, Menegotto                              %
% Institution: POlitecnico di Milano                                           %
% Date: 11/2026                                                                %
% File Version 1.0.2                                                           %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
% Physical governing equations (EULER, NAVIER_STOKES,
%                               WAVE_EQUATION, HEAT_EQUATION, FEM_ELASTICITY,
%                               POISSON_EQUATION)                        
SOLVER= RANS
%
% Specify turbulent model (NONE, SA, SA_NEG, SST)
KIND_TURB_MODEL= SA
% KIND_TURB_MODEL= SST % Appropriate for adverse pressure gradients and separation
%SST_OPTIONS= V2003m % Standard variation of SST when no option is wanted
% Specify if it's an axysymmetric problem (YES, NO)
AXISYMMETRIC= YES % Rotationally symmetric problem
%
% Mathematical problem (DIRECT, DISCRETE_ADJOINT) 
% DIRECT: calculate velocity, pressure, density, temperature and turbulence fields.
% DISCRETE_ADJOINT: calculate sensitivities of an objective to design variables.
MATH_PROBLEM= DIRECT
%
% Restart solution (NO, YES)
RESTART_SOL= YES
% 
% Specify the units of measurements
SYSTEM_MEASUREMENTS= SI 
%
% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
%
% Mach number (non-dimensional, based on the free-stream values)
MACH_NUMBER= 4.0
%
% Angle of attack (degrees, only for compressible flows)
AOA= 0.0
%
% Sideslip angle (degrees)
SIDESLIP_ANGLE= 0.0
%
% In order to use the pressure defined afterwards select YES
INIT_OPTION= TD_CONDITIONS % Thermodynamic state method utilizing pressure and temperature, other can use density and energy
%
% Free-stream temperature (288.15 K by default)
FREESTREAM_TEMPERATURE= 79.63
%
% Freestream pressure
FREESTREAM_PRESSURE= 9288.0 
%
% Parameters needed for the SST turbulence model
%FREESTREAM_TURBULENCEINTENSITY= 0.0008 % I = u_rms / U_inf, k_inf = 3/2 (I*U_inf)^2
%
%FREESTREAM_TURB2LAMVISCRATIO= 10.0 % sets the ratio of turbulent to laminar dynamic viscosity in the freestream, represents the turbulent momentum transport
%
% Fluid model (STANDARD_AIR, IDEAL_GAS, CONSTANT_DENSITY)
FLUID_MODEL= STANDARD_AIR
%
% Model to compute the viscosity (dynamic viscosity changes with temperature based on sutherland)
VISCOSITY_MODEL= SUTHERLAND
%
% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
% Reference origin for moment computation
%REF_ORIGIN_MOMENT_X = 0.25
%REF_ORIGIN_MOMENT_Y = 0.00
%REF_ORIGIN_MOMENT_Z = 0.00
%
% Reference length for pitching, rolling, and yawing non-dimensional moment
%REF_LENGTH= 1.0
%
% Reference area for force coefficients (0 implies automatic calculation)
%REF_AREA= 1.0
%
% Set the dimensionalization scheme (DIMENSIONAL, FREESTREAM_VEL_EQ_ONE)
REF_DIMENSIONALIZATION = DIMENSIONAL
%
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
% Navier-Stokes wall boundary marker(s) (NONE = no marker), viscous no-slip wall with prescribed heat flux, in this case 0, adiabatic wall
MARKER_HEATFLUX= ( wall, 0.0 )
%
% Farfield boundary marker(s) (NONE = no marker)
MARKER_FAR= ( inlet, farfield )
%
% Outlet boundary condition, need to state the static pressure
MARKER_OUTLET= ( outlet, 9288.0 ) 
%
% Where the symmetry condition is applied
MARKER_SYM= ( axis )
%
% Marker(s) of the surface to be plotted or designed
MARKER_PLOTTING= ( wall )
%
% Marker(s) of the surface where the functional (Cd, Cl, etc.) will be evaluated
MARKER_MONITORING= ( wall )
%
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
% Numerical method for spatial gradients (GREEN_GAUSS, WEIGHTED_LEAST_SQUARES)
NUM_METHOD_GRAD= GREEN_GAUSS
%NUM_METHOD_GRAD_RECON= LEAST_SQUARES
%
% Courant-Friedrichs-Lewy condition of the finest grid
CFL_NUMBER= 2.5
%
% Adaptive CFL number (NO, YES)
CFL_ADAPT= YES
%
% Parameters of the adaptive CFL number (factor down, factor up, CFL min value,
%                                        CFL max value )
CFL_ADAPT_PARAM= ( 0.1, 1.01, 1.0, 50.0 )
%
% Number of total iterations
ITER= 10000
%
% Linear solver for the implicit formulation (BCGSTAB, FGMRES)
LINEAR_SOLVER= FGMRES
%
% Min error of the linear solver for the implicit formulation
LINEAR_SOLVER_ERROR= 1E-6
%
% Max number of iterations of the linear solver for the implicit formulation
LINEAR_SOLVER_ITER= 10
%
% Acceleration technique that uses coarser representations of the mesh to reduce errors at different spatial scales, 0 to simplify the first simulations
MGLEVEL= 0 
%
% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
% Convective numerical method (JST, LAX-FRIEDRICH, CUSP, ROE, AUSM, HLLC,
%                              TURKEL_PREC, MSW)
CONV_NUM_METHOD_FLOW= JST
%
% Monotonic Upwind Scheme for Conservation Laws (TVD) in the flow equations.
%           Required for 2nd order upwind schemes (NO, YES)
MUSCL_FLOW= NO
%
% Slope limiter (VENKATAKRISHNAN, MINMOD), used for higher order cases
%SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
%
% Coefficient for the limiter (smooth regions), used for higher order cases
% VENKAT_LIMITER_COEFF= 0.05
%
% 2nd and 4th order artificial dissipation coefficients
JST_SENSOR_COEFF= ( 0.5, 0.02 )
%
% Time discretization (RUNGE-KUTTA_EXPLICIT, EULER_IMPLICIT, EULER_EXPLICIT)
TIME_DISCRE_FLOW= EULER_IMPLICIT
%
% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
%
% Convective numerical method (SCALAR_UPWIND)
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
%
% Monotonic Upwind Scheme for Conservation Laws (TVD) in the turbulence equations.
%           Required for 2nd order upwind schemes (NO, YES)
MUSCL_TURB= NO
%
% Time discretization (EULER_IMPLICIT)
TIME_DISCRE_TURB= EULER_IMPLICIT
%
% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
% Convergence criteria (CAUCHY, RESIDUAL), with field we can decide which quantity to monitor
%
CONV_FIELD= RMS_DENSITY
%
% Min value of the residual (log10 of the residual)
CONV_RESIDUAL_MINVAL= -7
%
% Start convergence criteria at iteration number
CONV_STARTITER= 50
%
% length of the sliding window used for Cauchy-type convergence evaluation
CONV_CAUCHY_ELEMS= 100
%
% defines the tolerance for the Cauchy convergence criterion
CONV_CAUCHY_EPS= 1E-6 
%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
% Mesh input file
MESH_FILENAME= spiked_body_cholesky_corr.su2
%
% Mesh input file format (SU2, CGNS, NETCDF_ASCII)
MESH_FORMAT= SU2
%
% Mesh output file
MESH_OUT_FILENAME= mesh_out.su2
%
% Restart flow input file
SOLUTION_FILENAME= restart_flow_M3.dat
%
% Restart adjoint input file
%SOLUTION_ADJ_FILENAME= solution_adj.dat
%
% Output file format (PARAVIEW, TECPLOT, STL)
TABULAR_FORMAT= CSV
%
% Output file convergence history (w/o extension) 
CONV_FILENAME= history_M4
%
% Output file restart flow
RESTART_FILENAME= restart_flow_M4.dat
%
% Output file restart adjoint
%RESTART_ADJ_FILENAME= restart_adj.dat
%
% Output file flow (w/o extension) variables
VOLUME_FILENAME= flow_M4
%
% Output file adjoint (w/o extension) variables
%VOLUME_ADJ_FILENAME= adjoint
%
% Output file surface flow coefficient (w/o extension)
SURFACE_FILENAME= surface_flow_M4
%
% Output file surface adjoint coefficient (w/o extension)
%SURFACE_ADJ_FILENAME= surface_adjoint
%
% Writing solution file frequency
OUTPUT_WRT_FREQ= 50
%
% Writing convergence history frequency
SCREEN_WRT_FREQ_INNER= 1
%
% Screen output fields 
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_PARAVIEW, CSV)
%
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_NU_TILDE, RMS_MOMENTUM-X, RMS_ENERGY, DRAG)
%
HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF)
%
VOLUME_OUTPUT= (COORDINATES, SOLUTION, PRIMITIVE, RESIDUAL)
%







